name: CI

# NOTE: this repository's default branch is `master`, not `main`. Every ref
# comparison below says master deliberately; copying a `main` guard in from
# another repo in this fleet silently disables it.
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # ruff, mypy and pytest in one job. They share a single `uv sync`, and the
  # suite is fast enough that splitting them would cost more in setup than it
  # saves in parallelism.
  python:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }
      # Installed from the pinned release tarball with a checksum rather than
      # via an action. Forge resolves actions from its own mirrors, whose sync
      # can prune a moved tag; a tarball URL and a sha256 cannot drift.
      - name: Install uv
        env:
          UV_VERSION: 0.11.28
          UV_SHA256: e490a6464492183c5d4534a5527fb4440f7f2bb2f228162ad7e4afe076dc0224
        run: |
          set -euo pipefail
          TARBALL="/tmp/uv.tar.gz"
          curl -sSL -o "$TARBALL" \
            "https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/uv-x86_64-unknown-linux-gnu.tar.gz"
          echo "${UV_SHA256}  ${TARBALL}" | sha256sum -c -
          tar -xz -C /tmp -f "$TARBALL"
          sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uv /usr/local/bin/uv
          sudo install -m 0755 /tmp/uv-x86_64-unknown-linux-gnu/uvx /usr/local/bin/uvx
          rm -rf "$TARBALL" /tmp/uv-x86_64-unknown-linux-gnu
          uv --version
      - name: Sync dependencies
        # --frozen fails rather than re-resolving, so a uv.lock that has drifted
        # from pyproject.toml is a CI failure and not a silent different build.
        run: uv sync --frozen --extra dev
      - name: ruff
        run: uv run ruff check src/ tests/ scripts/
      - name: mypy
        run: uv run mypy src/ scripts/
      - name: pytest
        run: uv run pytest
      # Runs the workflow's own cache-export guard under four refs and asserts
      # that exactly one of them exports. See the script for why a green docker
      # job does not prove this.
      - name: buildcache guard
        run: uv run python scripts/check_buildcache_guard.py

  # buildctl talks to the runner host's buildkitd. Registry-backed layer cache.
  docker:
    runs-on: ubuntu-22.04
    needs: python
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with: { persist-credentials: false }
      - name: Install buildctl
        env:
          BUILDKIT_VERSION: v0.30.0
          BUILDKIT_SHA256: 2da148c50540409988c837e62b72176e4a9ad7855548a2dd6ea1cd0c0d2d360d
        run: |
          set -euo pipefail
          TARBALL="/tmp/buildkit.tar.gz"
          curl -sSL -o "$TARBALL" \
            "https://github.com/moby/buildkit/releases/download/${BUILDKIT_VERSION}/buildkit-${BUILDKIT_VERSION}.linux-amd64.tar.gz"
          echo "${BUILDKIT_SHA256}  ${TARBALL}" | sha256sum -c -
          sudo tar -xz -C /usr/local --strip-components=0 -f "$TARBALL"
          rm -f "$TARBALL"
          buildctl --version
      - name: Login to Forgejo registry
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p ~/.docker
          F_AUTH=$(printf "%s:%s" "jlxq0" "${{ secrets.FORGE_PUSH_TOKEN }}" | base64 -w0)
          echo "{\"auths\":{\"forge.oddie.app\":{\"auth\":\"$F_AUTH\"}}}" > ~/.docker/config.json
      - name: Build (and push on tag)
        run: |
          set -euo pipefail
          # buildkitd runs on the runner host, listening on 0.0.0.0:1234. From
          # inside this job container the host is our own bridge gateway — never
          # a hardcoded IP (those change on reboot/DHCP and differ per repo).
          # The image is slim (no iproute2), so read the default route from
          # /proc/net/route via node (always present — actions run on it).
          GW="$(node -e 'const fs=require("fs");for(const l of fs.readFileSync("/proc/net/route","utf8").split("\n").slice(1)){const f=l.trim().split(/\s+/);if(f[1]==="00000000"){const h=f[2];console.log([h.slice(6,8),h.slice(4,6),h.slice(2,4),h.slice(0,2)].map(x=>parseInt(x,16)).join("."));break;}}')"
          export BUILDKIT_HOST="tcp://${GW}:1234"
          echo "buildkitd at ${BUILDKIT_HOST}"
          CACHE_REF="forge.oddie.app/jlxq0/listmonk-mcp:buildcache"
          BASE_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' pyproject.toml | head -1)"
          test -n "${BASE_VERSION}"
          REVISION="${GITHUB_SHA}"
          CREATED="$(git show -s --format=%cI HEAD)"
          IMPORT_CACHE_ARG=()
          EXPORT_CACHE_ARG=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/}"
            VERSION="${V#v}"
            if [[ "$VERSION" != "$BASE_VERSION" && "$VERSION" != "$BASE_VERSION"-* ]]; then
              echo "tag version ${VERSION} does not match pyproject version ${BASE_VERSION}" >&2
              exit 1
            fi
            TAGS="forge.oddie.app/jlxq0/listmonk-mcp:${V}"
            if [[ "$VERSION" != *-* ]]; then
              TAGS="${TAGS},forge.oddie.app/jlxq0/listmonk-mcp:latest"
            fi
            PUSH=true
            # Import only. A tag build is the same commit as the `master` build
            # that preceded it, so its cache would be byte-identical — and two
            # concurrent writers to one ref is what fails a run whose image is
            # already published. See the comment on the export below.
            IMPORT_CACHE_ARG=(--import-cache "type=registry,ref=${CACHE_REF}")
          elif [[ "$GITHUB_REF" == refs/heads/master ]]; then
            VERSION="${BASE_VERSION}-dev+${GITHUB_SHA::8}"
            TAGS="forge.oddie.app/jlxq0/listmonk-mcp:ci-${GITHUB_SHA::8}"
            PUSH=false
            IMPORT_CACHE_ARG=(--import-cache "type=registry,ref=${CACHE_REF}")
            # The ONLY writer to :buildcache, in this workflow and in this repo.
            # Merging a pull request and pushing the release tag are two pushes,
            # so two `docker` jobs run at once; both exporting to one
            # unqualified ref made one of them lose the blob write and fail with
            # `error writing layer blob: unknown` — after the image had already
            # been pushed. One writer removes the race by construction rather
            # than by scheduling.
            #
            # Guarded on the branch ref BY NAME. `github.event_name !=
            # 'pull_request'` looks equivalent and is not: it is also true on a
            # tag push, which is exactly the second writer being removed here.
            EXPORT_CACHE_ARG=(--export-cache "type=registry,ref=${CACHE_REF},mode=max")
          else
            VERSION="${BASE_VERSION}-dev+${GITHUB_SHA::8}"
            TAGS="forge.oddie.app/jlxq0/listmonk-mcp:ci-${GITHUB_SHA::8}"
            PUSH=false
          fi
          buildctl build \
            --frontend dockerfile.v0 \
            --local context=. \
            --local dockerfile=. \
            --opt "build-arg:BUILD_VERSION=${VERSION}" \
            --opt "build-arg:BUILD_REVISION=${REVISION}" \
            --opt "build-arg:BUILD_CREATED=${CREATED}" \
            "${IMPORT_CACHE_ARG[@]}" \
            "${EXPORT_CACHE_ARG[@]}" \
            --output "type=image,\"name=${TAGS}\",push=${PUSH}"
